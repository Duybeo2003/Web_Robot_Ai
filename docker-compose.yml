services:
  mysql:
    image: mysql:8.0
    container_name: RoboEQ-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-web_robot_ai}
      MYSQL_USER: ${DB_USER:-roboeq_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ROBOEQ_IMAGE:?ROBOEQ_IMAGE must reference an immutable release tag}
    container_name: RoboEQ-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Database — pass DATABASE_URL directly if set, otherwise construct from parts
      - DATABASE_URL=${DATABASE_URL:-mysql://${DB_USER:-roboeq_app}:${DB_PASSWORD:-}@mysql:3306/${DB_NAME:-web_robot_ai}}
      - REDIS_URL=redis://redis:6379
      # Auth
      - AUTH_SECRET=${NEXTAUTH_SECRET:-${AUTH_SECRET:?AUTH_SECRET or NEXTAUTH_SECRET is required}}
      - AUTH_URL=${NEXTAUTH_URL:-${AUTH_URL:?AUTH_URL or NEXTAUTH_URL is required}}
      - NEXT_PUBLIC_APP_URL=${NEXTAUTH_URL:-${AUTH_URL:-}}
      # Social links
      - SOCIAL_FACEBOOK_URL=${SOCIAL_FACEBOOK_URL:-}
      - SOCIAL_SHOPEE_URL=${SOCIAL_SHOPEE_URL:-}
      - SOCIAL_TIKTOK_URL=${SOCIAL_TIKTOK_URL:-}
      - SOCIAL_ZALO_URL=${SOCIAL_ZALO_URL:-}
      # Legal & support (shown in footer — provide real values)
      - LEGAL_COMPANY_NAME=${LEGAL_COMPANY_NAME:-RoboEQ}
      - LEGAL_TAX_CODE=${LEGAL_TAX_CODE:-}
      - LEGAL_REGISTRATION_NUMBER=${LEGAL_REGISTRATION_NUMBER:-}
      - LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
      - SUPPORT_PHONE=${SUPPORT_PHONE:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      # Email (Resend API — optional, emails skipped if not set)
      - EMAIL_API_URL=${EMAIL_API_URL:-https://api.resend.com/emails}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # SMS OTP (optional)
      - SMS_WEBHOOK_URL=${SMS_WEBHOOK_URL:-}
      - SMS_WEBHOOK_TOKEN=${SMS_WEBHOOK_TOKEN:-}
      # OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      # VNPay (optional — payment method disabled if not set)
      - VNP_TMN_CODE=${VNP_TMN_CODE:-}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET:-}
      - VNP_URL=${VNP_URL:-https://pay.vnpay.vn/vpcpay.html}
      - VNP_RETURN_URL=${VNP_RETURN_URL:-}
      # Bank transfer (optional)
      - BANK_ID=${BANK_ID:-}
      - BANK_ACCOUNT_NO=${BANK_ACCOUNT_NO:-}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME:-}
      # Cron jobs
      - CRON_SECRET=${CRON_SECRET:-}
      # Logistics (optional)
      - LOGISTICS_API_URL=${LOGISTICS_API_URL:-}
      - LOGISTICS_API_KEY=${LOGISTICS_API_KEY:-}
      # AI chatbot (optional)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Cloudinary image storage (required for product image upload)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Security
      - AUTH_TRUST_HOST=true
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: RoboEQ-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mysql_data:
