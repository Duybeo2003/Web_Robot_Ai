services:
  mysql:
    image: mysql:8.0
    container_name: RoboEQ-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-web_robot_ai}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ROBOEQ_IMAGE:?ROBOEQ_IMAGE must reference an immutable release tag}
    container_name: RoboEQ-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}@mysql:3306/${DB_NAME:-web_robot_ai}
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - AUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - NEXT_PUBLIC_APP_URL=${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      - NEXT_PUBLIC_TIKTOK_URL=${NEXT_PUBLIC_TIKTOK_URL}
      - LEGAL_COMPANY_NAME=${LEGAL_COMPANY_NAME:?LEGAL_COMPANY_NAME is required}
      - LEGAL_TAX_CODE=${LEGAL_TAX_CODE:?LEGAL_TAX_CODE is required}
      - LEGAL_REGISTRATION_NUMBER=${LEGAL_REGISTRATION_NUMBER}
      - LEGAL_ADDRESS=${LEGAL_ADDRESS:?LEGAL_ADDRESS is required}
      - SUPPORT_PHONE=${SUPPORT_PHONE:?SUPPORT_PHONE is required}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:?SUPPORT_EMAIL is required}
      - AUTH_TRUST_HOST=true
      - EMAIL_API_URL=${EMAIL_API_URL:-https://api.resend.com/emails}
      - EMAIL_API_KEY=${EMAIL_API_KEY:?EMAIL_API_KEY is required}
      - EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM is required}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - SMS_WEBHOOK_URL=${SMS_WEBHOOK_URL}
      - SMS_WEBHOOK_TOKEN=${SMS_WEBHOOK_TOKEN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_URL=${VNP_URL:-https://pay.vnpay.vn/vpcpay.html}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - BANK_ID=${BANK_ID}
      - BANK_ACCOUNT_NO=${BANK_ACCOUNT_NO}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - LOGISTICS_API_URL=${LOGISTICS_API_URL}
      - LOGISTICS_API_KEY=${LOGISTICS_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: RoboEQ-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mysql_data:
